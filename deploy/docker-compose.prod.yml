# Self-contained production stack for Hetzner.
# From repo root on the VPS:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
#
# Phase 1 research only — trading flags forced off.
# Optional Telegram AFK worker (paper): set TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID
# and TELEGRAM_DRY_RUN=false in .env, then:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env --profile telegram up -d --build telegram

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rh_research}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rh_chain}
    volumes:
      - rh_pgdata:/var/lib/postgresql/data
      - ../packages/db/drizzle/0000_init.sql:/docker-entrypoint-initdb.d/0000_init.sql:ro
      - ../packages/db/drizzle/0001_seed_fictional.sql:/docker-entrypoint-initdb.d/0001_seed_fictional.sql:ro
      - ../packages/db/drizzle/0002_verify_factories.sql:/docker-entrypoint-initdb.d/0002_verify_factories.sql:ro
    # localhost only — never expose publicly
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rh_research} -d ${POSTGRES_DB:-rh_chain}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_PORT: ${API_PORT:-3001}
      API_HOST: 0.0.0.0
      CORS_ORIGIN: ${CORS_ORIGIN}
      CHAIN_ID: ${CHAIN_ID:-4663}
      BLOCKSCOUT_BASE_URL: ${BLOCKSCOUT_BASE_URL:-https://robinhoodchain.blockscout.com}
      ENABLE_TRADING: "false"
      ENABLE_TX_SUBMISSION: "false"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  collector:
    build:
      context: ..
      dockerfile: workers/collector/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CHAIN_ID: ${CHAIN_ID:-4663}
      RPC_URL: ${RPC_URL:-}
      BLOCKSCOUT_BASE_URL: ${BLOCKSCOUT_BASE_URL:-https://robinhoodchain.blockscout.com}
      COLLECTOR_POLL_MS: ${COLLECTOR_POLL_MS:-15000}
      LOG_BLOCK_WINDOW: ${LOG_BLOCK_WINDOW:-2000}
      COLLECTOR_LOOKBACK_BLOCKS: ${COLLECTOR_LOOKBACK_BLOCKS:-5000}
      ENABLE_TRADING: "false"
      ENABLE_TX_SUBMISSION: "false"
    depends_on:
      postgres:
        condition: service_healthy

  # Paper AFK Telegram worker (@Rhjuice_bot). No keys / no live sells.
  # Requires TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID in VPS .env.
  # Keep TELEGRAM_DRY_RUN=true until ready; set false for live Bot API.
  telegram:
    build:
      context: ..
      dockerfile: workers/telegram/Dockerfile
    restart: unless-stopped
    profiles: ["telegram"]
    environment:
      API_BASE_URL: ${TELEGRAM_API_BASE_URL:-http://api:3001}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_DRY_RUN: ${TELEGRAM_DRY_RUN:-true}
      POLL_MS: ${TELEGRAM_POLL_MS:-15000}
      LARGE_MOVE_PCT: ${LARGE_MOVE_PCT:-25}
      ENABLE_TRADING: "false"
      ENABLE_TX_SUBMISSION: "false"
    depends_on:
      - api

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  rh_pgdata:
  caddy_data:
  caddy_config:
