# Self-contained production stack for Hetzner.
# From repo root on the VPS:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
#
# Phase 1 research only — trading flags forced off.
# Optional Telegram AFK worker (paper): set TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID
# and TELEGRAM_DRY_RUN=false in .env, then:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env --profile telegram up -d --build telegram

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rh_research}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rh_chain}
    volumes:
      - rh_pgdata:/var/lib/postgresql/data
      - ../packages/db/drizzle/0000_init.sql:/docker-entrypoint-initdb.d/0000_init.sql:ro
      - ../packages/db/drizzle/0001_seed_fictional.sql:/docker-entrypoint-initdb.d/0001_seed_fictional.sql:ro
      - ../packages/db/drizzle/0002_verify_factories.sql:/docker-entrypoint-initdb.d/0002_verify_factories.sql:ro
      - ../packages/db/drizzle/0006_social_discovery.sql:/docker-entrypoint-initdb.d/0006_social_discovery.sql:ro
      - ../packages/db/drizzle/0007_project_research.sql:/docker-entrypoint-initdb.d/0007_project_research.sql:ro
      - ../packages/db/drizzle/0008_market_pricing.sql:/docker-entrypoint-initdb.d/0008_market_pricing.sql:ro
      - ../packages/db/drizzle/0009_paper_ledger.sql:/docker-entrypoint-initdb.d/0009_paper_ledger.sql:ro
      - ../packages/db/drizzle/0010_identity_gate.sql:/docker-entrypoint-initdb.d/0010_identity_gate.sql:ro
      - ../packages/db/drizzle/0011_watch_intake.sql:/docker-entrypoint-initdb.d/0011_watch_intake.sql:ro
      - ../packages/db/drizzle/0012_x_budget.sql:/docker-entrypoint-initdb.d/0012_x_budget.sql:ro
      - ../packages/db/drizzle/0013_collection_control.sql:/docker-entrypoint-initdb.d/0013_collection_control.sql:ro
      - ../packages/db/drizzle/0014_launch_preparation.sql:/docker-entrypoint-initdb.d/0014_launch_preparation.sql:ro
      - ../packages/db/drizzle/0015_paper_snipes.sql:/docker-entrypoint-initdb.d/0015_paper_snipes.sql:ro
    # localhost only — never expose publicly
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rh_research} -d ${POSTGRES_DB:-rh_chain}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_PORT: ${API_PORT:-3001}
      API_HOST: 0.0.0.0
      CORS_ORIGIN: ${CORS_ORIGIN}
      TELEGRAM_APPROVAL_TOKEN: ${TELEGRAM_APPROVAL_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_OWNER_USER_ID: ${TELEGRAM_OWNER_USER_ID:-}
      MARKET_PRICING_ENABLED: ${MARKET_PRICING_ENABLED:-false}
      PAPER_LEDGER_ENABLED: ${PAPER_LEDGER_ENABLED:-false}
      PAPER_SNIPER_ENABLED: ${PAPER_SNIPER_ENABLED:-false}
      IDENTITY_GATE_ENABLED: ${IDENTITY_GATE_ENABLED:-false}
      PAPER_CASH_ETH: ${PAPER_CASH_ETH:-1}
      PAPER_CASH_USD: ${PAPER_CASH_USD:-0}
      CHAIN_ID: ${CHAIN_ID:-4663}
      BLOCKSCOUT_BASE_URL: ${BLOCKSCOUT_BASE_URL:-https://robinhoodchain.blockscout.com}
      ENABLE_TRADING: "false"
      ENABLE_TX_SUBMISSION: "false"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  collector:
    build:
      context: ..
      dockerfile: workers/collector/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CHAIN_ID: ${CHAIN_ID:-4663}
      RPC_URL: ${RPC_URL:-}
      PAPER_SNIPER_ENABLED: ${PAPER_SNIPER_ENABLED:-false}
      X_DISCOVERY_ENABLED: ${X_DISCOVERY_ENABLED:-false}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      WATCH_X_ENABLED: ${WATCH_X_ENABLED:-false}
      TWITTERAPI_IO_KEY: ${TWITTERAPI_IO_KEY:-}
      X_POLL_MS: ${X_POLL_MS:-300000}
      X_ACCOUNTS_PER_TICK: ${X_ACCOUNTS_PER_TICK:-1}
      X_GRAPH_INTERVAL_MS: ${X_GRAPH_INTERVAL_MS:-3600000}
      X_MAX_GRAPH_USERS: ${X_MAX_GRAPH_USERS:-10000}
      PROJECT_RESEARCH_ENABLED: ${PROJECT_RESEARCH_ENABLED:-false}
      IDENTITY_GATE_ENABLED: ${IDENTITY_GATE_ENABLED:-false}
      MARKET_PRICING_ENABLED: ${MARKET_PRICING_ENABLED:-false}
      GROK_RESEARCH_ENABLED: ${GROK_RESEARCH_ENABLED:-false}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-}
      BLOCKSCOUT_BASE_URL: ${BLOCKSCOUT_BASE_URL:-https://robinhoodchain.blockscout.com}
      COLLECTOR_POLL_MS: ${COLLECTOR_POLL_MS:-300000}
      COLLECTOR_CURSOR_PATH: /data/launch-cursor.json
      WALLET_CURSOR_PATH: /data/wallet-cursor.json
      LOG_BLOCK_WINDOW: ${LOG_BLOCK_WINDOW:-2000}
      COLLECTOR_LOOKBACK_BLOCKS: ${COLLECTOR_LOOKBACK_BLOCKS:-5000}
      ENABLE_TRADING: "false"
      ENABLE_TX_SUBMISSION: "false"
    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - collector_state:/data

  # Paper AFK Telegram worker (@Rhjuice_bot). No keys / no live sells.
  # Requires TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID in VPS .env.
  # Keep TELEGRAM_DRY_RUN=true until ready; set false for live Bot API.
  telegram:
    build:
      context: ..
      dockerfile: workers/telegram/Dockerfile
    restart: unless-stopped
    profiles: ["telegram"]
    environment:
      API_BASE_URL: ${TELEGRAM_API_BASE_URL:-http://api:3001}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_APPROVAL_TOKEN: ${TELEGRAM_APPROVAL_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_OWNER_USER_ID: ${TELEGRAM_OWNER_USER_ID:-}
      TELEGRAM_DRY_RUN: ${TELEGRAM_DRY_RUN:-true}
      TG_RESEARCH_STATE_PATH: /data/research-alerts.json
      TG_FILL_STATE_PATH: /data/fill-receipts.json
      POLL_MS: ${TELEGRAM_POLL_MS:-15000}
      LARGE_MOVE_PCT: ${LARGE_MOVE_PCT:-25}
      ENABLE_TRADING: "false"
      ENABLE_TX_SUBMISSION: "false"
    volumes:
      - telegram_state:/data
    depends_on:
      - api

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  rh_pgdata:
  telegram_state:
  collector_state:
  caddy_data:
  caddy_config:
