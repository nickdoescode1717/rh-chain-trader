services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rh_research}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-rh_chain}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db/drizzle/0000_init.sql:/docker-entrypoint-initdb.d/0000_init.sql:ro
      - ./packages/db/drizzle/0001_seed_fictional.sql:/docker-entrypoint-initdb.d/0001_seed_fictional.sql:ro
      - ./packages/db/drizzle/0002_verify_factories.sql:/docker-entrypoint-initdb.d/0002_verify_factories.sql:ro
      - ./packages/db/drizzle/0006_social_discovery.sql:/docker-entrypoint-initdb.d/0006_social_discovery.sql:ro
      - ./packages/db/drizzle/0007_project_research.sql:/docker-entrypoint-initdb.d/0007_project_research.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rh_research} -d ${POSTGRES_DB:-rh_chain}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rh_research}:${POSTGRES_PASSWORD:-changeme_local_only}@postgres:5432/${POSTGRES_DB:-rh_chain}
      API_PORT: 3001
      API_HOST: 0.0.0.0
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      TELEGRAM_APPROVAL_TOKEN: ${TELEGRAM_APPROVAL_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_OWNER_USER_ID: ${TELEGRAM_OWNER_USER_ID:-}
      CHAIN_ID: "4663"
      BLOCKSCOUT_BASE_URL: https://robinhoodchain.blockscout.com
      ENABLE_TRADING: "false"
      ENABLE_TX_SUBMISSION: "false"
    depends_on:
      postgres:
        condition: service_healthy

  collector:
    build:
      context: .
      dockerfile: workers/collector/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rh_research}:${POSTGRES_PASSWORD:-changeme_local_only}@postgres:5432/${POSTGRES_DB:-rh_chain}
      CHAIN_ID: "4663"
      BLOCKSCOUT_BASE_URL: https://robinhoodchain.blockscout.com
      RPC_URL: ${RPC_URL:-}
      X_DISCOVERY_ENABLED: ${X_DISCOVERY_ENABLED:-false}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      X_POLL_MS: ${X_POLL_MS:-300000}
      X_ACCOUNTS_PER_TICK: ${X_ACCOUNTS_PER_TICK:-1}
      X_GRAPH_INTERVAL_MS: ${X_GRAPH_INTERVAL_MS:-3600000}
      X_MAX_GRAPH_USERS: ${X_MAX_GRAPH_USERS:-10000}
      PROJECT_RESEARCH_ENABLED: ${PROJECT_RESEARCH_ENABLED:-false}
      GROK_RESEARCH_ENABLED: ${GROK_RESEARCH_ENABLED:-false}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-}
      COLLECTOR_POLL_MS: ${COLLECTOR_POLL_MS:-15000}
      LOG_BLOCK_WINDOW: ${LOG_BLOCK_WINDOW:-2000}
      COLLECTOR_LOOKBACK_BLOCKS: ${COLLECTOR_LOOKBACK_BLOCKS:-5000}
      ENABLE_TRADING: "false"
      ENABLE_TX_SUBMISSION: "false"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  pgdata:
